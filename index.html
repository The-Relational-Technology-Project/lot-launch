<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Library of Things Launch Plan</title>
<meta name="description" content="A guided workbook for writing the launch plan for a library of things in your building, grounded in Shareable's Library of Things Toolkit 2.0.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#232D58">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Source+Serif+4:opsz,wght@8..60,400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top no-print" id="top"></header>
<div class="shell">
  <nav class="side" id="side" aria-label="Sections"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<div id="ask"></div>

<script>
// The workbook. Each section is three steps: jot first thoughts, read what the
// toolkit says about them, then write the plan in your own words. The server
// (supabase/functions/lot-plan, action "guide") only finds toolkit passages and
// quotes them word for word. Nothing here rewrites a person's words.
const API = 'https://texakzqqenzpxawktbgx.supabase.co/functions/v1/lot-plan';
const TOOLKIT = 'https://www.shareable.net/toolkit/library-of-things/';
// Served from Shareable's own site, resized by their image CDN
const COVER = 'https://i0.wp.com/www.shareable.net/wp-content/uploads/2026/03/LoT-2-Digital-Toolkit-Cover-2-scaled.png?w=1200&quality=80&ssl=1';
const STORE = 'lot-launch-plan-v2';
const OLD_STORE = 'lot-launch-plan-v1';

// Filled from sections.json, the one file that sets what the workbook asks
let PROJECT_FIELDS = [];
let SECTIONS = [];

// ---------- State ----------

function blankSection() {
  // first: quick notes (step 1). plan: their own words for the plan (step 3),
  // started from the first notes until they change it. notes: still to figure out.
  return { first: '', plan: '', planTouched: false, passages: [], suggestions: [], notes: '', looked: false, skipped: false, done: false };
}

/** Sections saved before the three steps had one answer per question */
function upgrade(sec) {
  if (!Array.isArray(sec.answers)) return sec;
  const joined = sec.answers.filter((a) => String(a || '').trim()).join('\n\n');
  const { answers, ...rest } = sec;
  return { ...rest, first: joined, plan: joined, planTouched: Boolean(joined) };
}

function blank() {
  const sections = {};
  for (const s of SECTIONS) sections[s.id] = blankSection();
  return { view: 'welcome', project: {}, sections };
}

let state;

function load() {
  state = blank();
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (saved && saved.sections) {
      state = { ...state, ...saved, sections: state.sections };
      for (const s of SECTIONS) if (saved.sections[s.id]) state.sections[s.id] = { ...blankSection(), ...upgrade(saved.sections[s.id]) };
      return;
    }
    // Carry what people typed in the first version; its AI-written drafts are left behind
    const old = JSON.parse(localStorage.getItem(OLD_STORE) || 'null');
    if (old && old.sections) {
      state.project = old.project || {};
      for (const s of SECTIONS) if (old.sections[s.id] && Array.isArray(old.sections[s.id].answers)) state.sections[s.id] = { ...blankSection(), ...upgrade({ answers: old.sections[s.id].answers }) };
    }
  } catch { /* a fresh start is fine */ }
}

function save() {
  try { localStorage.setItem(STORE, JSON.stringify(state)); } catch { /* private mode: keep working in memory */ }
}

// Not saved: what is happening right now
const live = { busy: null, error: null, navOpen: false, ask: { open: false, q: '', passages: null, busy: false, error: null } };

// ---------- Small helpers ----------

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sectionById = (id) => SECTIONS.find((s) => s.id === id);
const lines = (text) => String(text || '').split('\n').filter((l) => l.trim());
/** Their words for the plan: what they wrote in step 3, or their first notes if they stopped at step 1 */
const words = (sec) => (String(sec.plan || '').trim() ? sec.plan : sec.first) || '';
const answered = (sec) => Boolean(words(sec).trim());
const kept = (sec) => sec.passages.filter((p) => p.keep);
const started = (sec) => answered(sec) || kept(sec).length > 0 || lines(sec.notes).length > 0;

async function call(body) {
  let res;
  try {
    res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  } catch {
    throw new Error('Could not reach the server. Check your connection and try again. Your answers are saved.');
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Something went wrong. Try again.');
  return data;
}

function sourceLine(p) {
  const where = [p.section, p.chapter && p.chapter !== p.heading ? p.chapter : ''].filter(Boolean).join(', ');
  return `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.heading)}</a> <span>${esc(where)}</span>`;
}

// ---------- Actions ----------

function go(view) {
  state.view = view;
  live.error = null; live.navOpen = false;
  save();
  render();
  window.scrollTo(0, 0);
  document.getElementById('main').focus({ preventScroll: true });
}

function nextAfter(id) {
  const i = SECTIONS.findIndex((s) => s.id === id);
  return i + 1 < SECTIONS.length ? SECTIONS[i + 1].id : 'plan';
}

async function look(id) {
  if (live.busy) return;
  const spec = sectionById(id);
  const sec = state.sections[id];
  live.busy = id; live.error = null;
  render();
  document.getElementById('toolkit-part')?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  try {
    const data = await call({ action: 'guide', section: id, project: state.project, answers: [{ q: `First thoughts on ${spec.title}. Things to touch on: ${spec.questions.join(' ')}`, a: sec.first }] });
    // A passage the person already unticked stays unticked if it comes back
    const dropped = new Set(sec.passages.filter((p) => !p.keep).map((p) => p.quote));
    sec.passages = (data.passages || []).map((p) => ({ ...p, keep: !dropped.has(p.quote) }));
    const added = new Set(sec.suggestions.filter((q) => q.added).map((q) => q.q));
    sec.suggestions = (data.questions || []).map((q) => ({ ...q, added: added.has(q.q) }));
    sec.looked = true;
    // Step 3 starts from their own first notes, so nobody types twice
    if (!sec.planTouched) sec.plan = sec.first;
  } catch (err) {
    live.error = err.message;
  }
  live.busy = null;
  save();
  render();
}

async function ask() {
  const a = live.ask;
  if (a.busy || a.q.trim().length < 3) return;
  a.busy = true; a.error = null; a.passages = null;
  renderAsk();
  try {
    a.passages = (await call({ action: 'guide', question: a.q, project: state.project })).passages || [];
  } catch (err) {
    a.error = err.message;
  }
  a.busy = false;
  renderAsk();
}

/**
 * The plan as a flat list of blocks, the one shape every export is made from.
 * Text the person wrote is carried as is: no trimming inside it, no rewording.
 */
function planBlocks() {
  const p = state.project;
  const out = [{ t: 'title', text: 'Library of Things Launch Plan' }];
  for (const f of PROJECT_FIELDS) if (String(p[f.key] || '').trim()) out.push({ t: 'label', text: f.label }, { t: 'own', text: p[f.key] });
  const open = [];
  for (const s of SECTIONS) {
    const sec = state.sections[s.id];
    if (!started(sec)) continue;
    out.push({ t: 'h1', text: s.title });
    if (answered(sec)) out.push({ t: 'h2', text: 'Our plan' }, { t: 'own', text: words(sec) });
    if (kept(sec).length) {
      out.push({ t: 'h2', text: 'From the toolkit' });
      for (const k of kept(sec)) out.push({ t: 'quote', text: k.quote, source: k.heading, url: k.url });
    }
    if (lines(sec.notes).length) {
      out.push({ t: 'h2', text: 'Still to figure out' });
      for (const l of lines(sec.notes)) { out.push({ t: 'li', text: l }); open.push({ t: 'li', text: l, from: s.title }); }
    }
  }
  if (open.length) out.push({ t: 'h1', text: 'Everything still to figure out' }, ...open);
  out.push({ t: 'small', text: 'Our plan and open questions are exactly as we wrote them. Toolkit passages are quoted word for word from the Library of Things Toolkit 2.0 by Shareable (CC BY-NC-ND 4.0).', source: 'shareable.net/toolkit/library-of-things', url: TOOLKIT });
  return out;
}

/** For pasting into Google Docs or Word: real headings, quotes and links */
function planHtml() {
  const own = (text) => esc(text).replace(/\n/g, '<br>');
  return planBlocks().map((b) => {
    switch (b.t) {
      case 'title': return `<h1>${esc(b.text)}</h1>`;
      case 'h1': return `<h2>${esc(b.text)}</h2>`;
      case 'h2': return `<h3>${esc(b.text)}</h3>`;
      case 'label': return `<p><b>${esc(b.text)}</b></p>`;
      case 'own': return `<p>${own(b.text)}</p>`;
      case 'quote': return `<blockquote><p><i>“${esc(b.text)}”</i></p><p>Source: <a href="${esc(b.url)}">${esc(b.source)}</a></p></blockquote>`;
      case 'li': return `<ul><li>${esc(b.text)}${b.from ? ` (${esc(b.from)})` : ''}</li></ul>`;
      default: return `<p><small>${esc(b.text)} <a href="${esc(b.url)}">${esc(b.source)}</a></small></p>`;
    }
  }).join('\n').replace(/<\/ul>\n<ul>/g, '');
}

// ---------- Word file (.docx), written here so nothing is uploaded anywhere ----------

const CRC = (() => {
  const table = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; table[n] = c >>> 0; }
  return (bytes) => { let c = 0xffffffff; for (const b of bytes) c = table[(c ^ b) & 0xff] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; };
})();

/** A zip archive with the files stored as they are (a .docx is a zip of small XML files) */
function zip(files) {
  const enc = new TextEncoder();
  const parts = [];
  const central = [];
  let offset = 0;
  const header = (sig, fields) => {
    const view = new DataView(new ArrayBuffer(4 + fields.reduce((n, f) => n + f[0], 0)));
    view.setUint32(0, sig, true);
    let at = 4;
    for (const [size, value] of fields) { if (size === 2) view.setUint16(at, value, true); else view.setUint32(at, value, true); at += size; }
    return new Uint8Array(view.buffer);
  };
  for (const [name, text] of files) {
    const nameBytes = enc.encode(name);
    const data = enc.encode(text);
    const crc = CRC(data);
    // version, UTF-8 names, stored, time, date (1 Jan 2026), crc, sizes, name length, extra length
    const common = [[2, 20], [2, 0x0800], [2, 0], [2, 0], [2, 0x5c21], [4, crc], [4, data.length], [4, data.length], [2, nameBytes.length], [2, 0]];
    const local = header(0x04034b50, common);
    parts.push(local, nameBytes, data);
    central.push(header(0x02014b50, [[2, 20], ...common, [2, 0], [2, 0], [2, 0], [4, 0], [4, offset]]), nameBytes);
    offset += local.length + nameBytes.length + data.length;
  }
  const centralSize = central.reduce((n, b) => n + b.length, 0);
  const end = header(0x06054b50, [[2, 0], [2, 0], [2, files.length], [2, files.length], [4, centralSize], [4, offset], [2, 0]]);
  return new Blob([...parts, ...central, end], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}

function planDocx() {
  // XML cannot hold control characters; everything else the person typed stays
  const x = (text) => String(text ?? '').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F￾￿]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const run = (text, props = '') => `<w:r>${props ? `<w:rPr>${props}</w:rPr>` : ''}${String(text).split('\n').map((line, i) => `${i ? '<w:br/>' : ''}<w:t xml:space="preserve">${x(line.replace(/\r$/, ''))}</w:t>`).join('')}</w:r>`;
  const para = (style, inner) => `<w:p><w:pPr><w:pStyle w:val="${style}"/></w:pPr>${inner}</w:p>`;
  const links = [];
  const link = (label, url) => { links.push(url); return `<w:hyperlink r:id="rLink${links.length}">${run(label, '<w:rStyle w:val="Hyperlink"/>')}</w:hyperlink>`; };
  const body = planBlocks().map((b) => {
    switch (b.t) {
      case 'title': return para('Title', run(b.text));
      case 'h1': return para('Heading1', run(b.text));
      case 'h2': return para('Heading2', run(b.text));
      case 'label': return para('Label', run(b.text));
      case 'own': return para('Normal', run(b.text));
      case 'quote': return para('Quote', run(`“${b.text}”`)) + para('Source', run('Source: ') + link(b.source, b.url));
      case 'li': return para('Bullet', run(`•\t${b.text}${b.from ? ` (${b.from})` : ''}`));
      default: return para('Source', run(`${b.text} `) + link(b.source, b.url));
    }
  }).join('');
  const W = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"';
  const head = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
  const style = (id, name, ppr, rpr, extra = '') => `<w:style w:type="paragraph" w:styleId="${id}"${id === 'Normal' ? ' w:default="1"' : ''}><w:name w:val="${name}"/>${id === 'Normal' ? '' : '<w:basedOn w:val="Normal"/>'}${extra}<w:pPr>${ppr}</w:pPr><w:rPr>${rpr}</w:rPr></w:style>`;
  const navy = '<w:color w:val="232D58"/>';
  const styles = `${head}<w:styles ${W}><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/><w:sz w:val="22"/><w:szCs w:val="22"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="160" w:line="276" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>`
    + style('Normal', 'Normal', '', '')
    + style('Title', 'Title', '<w:spacing w:after="240"/>', `<w:b/>${navy}<w:sz w:val="52"/><w:szCs w:val="52"/>`, '<w:next w:val="Normal"/>')
    + style('Heading1', 'heading 1', '<w:keepNext/><w:spacing w:before="400" w:after="120"/><w:outlineLvl w:val="0"/>', `<w:b/>${navy}<w:sz w:val="34"/><w:szCs w:val="34"/>`, '<w:next w:val="Normal"/>')
    + style('Heading2', 'heading 2', '<w:keepNext/><w:spacing w:before="240" w:after="80"/><w:outlineLvl w:val="1"/>', '<w:b/><w:caps/><w:color w:val="3C5347"/><w:sz w:val="20"/><w:szCs w:val="20"/>', '<w:next w:val="Normal"/>')
    + style('Label', 'Label', '<w:keepNext/><w:spacing w:after="20"/>', '<w:color w:val="55608A"/><w:sz w:val="20"/><w:szCs w:val="20"/>')
    + style('Quote', 'Quote', '<w:spacing w:after="40"/><w:ind w:left="454" w:right="454"/>', '<w:i/>')
    + style('Source', 'Source', '<w:ind w:left="454"/>', '<w:color w:val="55608A"/><w:sz w:val="18"/><w:szCs w:val="18"/>')
    + style('Bullet', 'Bullet', '<w:spacing w:after="80"/><w:tabs><w:tab w:val="left" w:pos="454"/></w:tabs><w:ind w:left="454" w:hanging="284"/>', '')
    + '<w:style w:type="character" w:styleId="Hyperlink"><w:name w:val="Hyperlink"/><w:rPr><w:color w:val="1A4D8F"/><w:u w:val="single"/></w:rPr></w:style></w:styles>';
  const R = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  return zip([
    ['[Content_Types].xml', `${head}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`],
    ['_rels/.rels', `${head}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${R}/officeDocument" Target="word/document.xml"/></Relationships>`],
    ['word/document.xml', `${head}<w:document ${W} xmlns:r="${R}"><w:body>${body}<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr></w:body></w:document>`],
    ['word/styles.xml', styles],
    ['word/_rels/document.xml.rels', `${head}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${R}/styles" Target="styles.xml"/>${links.map((url, i) => `<Relationship Id="rLink${i + 1}" Type="${R}/hyperlink" Target="${x(url)}" TargetMode="External"/>`).join('')}</Relationships>`],
  ]);
}

/** The plan as plain text. Answers and open questions go in exactly as typed. */
function planMarkdown() {
  const p = state.project;
  const out = ['# Library of Things Launch Plan', ''];
  for (const f of PROJECT_FIELDS) if (String(p[f.key] || '').trim()) out.push(`**${f.label}**`, '', p[f.key], '');
  const open = [];
  for (const s of SECTIONS) {
    const sec = state.sections[s.id];
    if (!started(sec)) continue;
    out.push(`## ${s.title}`, '');
    if (answered(sec)) out.push('### Our plan', '', words(sec), '');
    if (kept(sec).length) {
      out.push('### From the toolkit', '');
      for (const k of kept(sec)) out.push(`> ${k.quote}`, '', `Source: ${k.heading}, ${k.url}`, '');
    }
    if (lines(sec.notes).length) {
      out.push('### Still to figure out', '', ...lines(sec.notes).map((l) => `- ${l}`), '');
      for (const l of lines(sec.notes)) open.push(`${l} (${s.title})`);
    }
  }
  if (open.length) out.push('## Everything still to figure out', '', ...open.map((l) => `- ${l}`), '');
  out.push(`Our plan and open questions are exactly as we wrote them. Toolkit passages are quoted word for word from the Library of Things Toolkit 2.0 by Shareable (CC BY-NC-ND 4.0): ${TOOLKIT}`);
  return out.join('\n');
}

// ---------- Views ----------

function footer() {
  return `<footer>
    An experiment by the Relational Tech Project, built on the <a href="${TOOLKIT}" target="_blank" rel="noopener">Library of Things Toolkit 2.0</a> by Shareable (CC BY-NC-ND 4.0). It is not the toolkit itself.
    Check anything about insurance, legal or money with your own advisors.
    <span class="no-print">What you write stays in this browser. It is sent to an AI model only to find toolkit passages that fit. The AI never writes or changes your plan.</span>
  </footer>`;
}

function aiCard() {
  return `<div class="card how">
    <div class="prose">
      <h3>How AI is used here, and how it is not</h3>
      <ul>
        <li><strong>You write the plan.</strong> Your words and your open questions go into the final plan exactly as you typed them.</li>
        <li><strong>The toolkit speaks for itself.</strong> Passages are quoted word for word from Shareable's toolkit, with a link to the page they came from.</li>
        <li><strong>AI only points.</strong> It reads what you wrote to pick which toolkit passages to show, adds a one-line note on why, and suggests questions you might add. Each of those is labelled.</li>
      </ul>
    </div>
  </div>`;
}

function viewWelcome() {
  const begun = Object.values(state.project).some((v) => String(v || '').trim()) || SECTIONS.some((s) => started(state.sections[s.id]));
  return `<div class="col">
    <div class="hero">
      <div class="hero-text">
        <div class="pill">For Co-Lab teams</div>
        <h1>Write your launch plan, one section at a time</h1>
        <p class="lede">About 30 minutes. For each part of your plan: jot your first thoughts, see what Shareable's Library of Things Toolkit says, then write it in your own words.</p>
        <div class="row">
          <button class="btn" data-go="project">${begun ? 'Pick up where you left off' : 'Start with your project'}</button>
        </div>
      </div>
      <a class="hero-art" href="${TOOLKIT}" target="_blank" rel="noopener" aria-label="The Library of Things Toolkit, second edition, by Shareable">
        <img src="${COVER}" alt="Cover of The Library of Things Toolkit, second edition, by Shareable" width="1200" height="799" onerror="this.parentNode.remove()">
      </a>
    </div>
    <ol class="three">
      <li><span class="num">1</span><div><strong>First thoughts.</strong> A minute of quick notes or gut feel.</div></li>
      <li><span class="num">2</span><div><strong>Things to consider.</strong> A few passages from the toolkit, word for word, picked for your notes.</div></li>
      <li><span class="num">3</span><div><strong>Your plan, in your words.</strong> Your notes come with you. Change them after reading, and list what is still open.</div></li>
    </ol>
    <p class="lede">${SECTIONS.length} sections, about 3 minutes each. Skip what you cannot answer yet. Your work is saved in this browser, so you can stop and come back.</p>
    ${aiCard()}
    ${begun ? '<div class="row"><button class="btn quiet" data-act="reset">Start over</button></div>' : ''}
    ${footer()}
  </div>`;
}

function viewProject() {
  const field = (f) => `<div class="field">
      <label for="p-${f.key}">${esc(f.label)}${f.hint ? `<span class="hint">${esc(f.hint)}</span>` : ''}</label>
      ${f.short
        ? `<input type="text" id="p-${f.key}" data-project="${f.key}" value="${esc(state.project[f.key])}">`
        : `<textarea id="p-${f.key}" data-project="${f.key}">${esc(state.project[f.key])}</textarea>`}
    </div>`;
  const short = PROJECT_FIELDS.filter((f) => f.short);
  const long = PROJECT_FIELDS.filter((f) => !f.short);
  return `<div class="col">
    <div class="pill">Step 1</div>
    <h2>About your project</h2>
    <p class="lede">Two minutes. This goes at the top of your plan exactly as you write it, and helps find toolkit passages that fit your building.</p>
    <div class="two">${short.map(field).join('')}</div>
    ${long.map(field).join('')}
    <div class="row">
      <button class="btn" data-go="${SECTIONS[0].id}">Start the plan</button>
    </div>
    ${footer()}
  </div>`;
}

function passageHtml(p, i, withKeep) {
  return `<div class="passage${withKeep && !p.keep ? ' off' : ''}">
    <blockquote>${esc(p.quote)}</blockquote>
    <div class="source">${sourceLine(p)}</div>
    ${p.why ? `<p class="ai-note"><span class="ai-tag">AI note</span> ${esc(p.why)}</p>` : ''}
    ${withKeep ? `<label class="keep"><input type="checkbox" data-keep="${i}" ${p.keep ? 'checked' : ''}> Keep in my plan</label>` : ''}
  </div>`;
}

function viewSection(spec) {
  const sec = state.sections[spec.id];
  const n = SECTIONS.indexOf(spec) + 1;
  const busy = live.busy === spec.id;
  // Steps 2 and 3 open once they have looked, or chosen to go on without the toolkit
  const open = sec.looked || sec.skipped;
  const head = (num, title) => `<h3 class="step-head"><span class="num">${num}</span>${title}</h3>`;

  let consider;
  if (busy) consider = `<div class="writing"><span class="pulse"></span>Looking through the toolkit for passages that fit your notes</div>`;
  else if (!sec.looked) consider = `<p class="part-hint">A few passages from Shareable's toolkit, word for word, picked for what you jotted down.</p>`;
  else if (!sec.passages.length) consider = `<p class="part-hint">Nothing in the toolkit matched closely. You can add a little more in step 1 and look again, or carry on.</p>
      <div class="row"><button class="btn dark small" data-act="look">Look again</button></div>`;
  else consider = `<p class="part-hint">Word for word from Shareable's toolkit, picked for your notes. Read them, then write your plan below. Untick any you do not want kept in your plan.</p>
      ${sec.passages.map((p, i) => passageHtml(p, i, true)).join('')}`;

  const suggestions = sec.suggestions.length ? `<div class="suggest">
      <div class="tag"><span class="ai-tag">AI suggestion</span> Questions the toolkit passages raise. Tap one to add it to your list.</div>
      ${sec.suggestions.map((q, i) => `<button class="chip${q.added ? ' added' : ''}" data-suggest="${i}" ${q.added ? 'disabled' : ''}>${q.added ? '✓' : '+'} ${esc(q.q)}</button>`).join('')}
    </div>` : '';

  return `<div class="col">
    <div class="pill">Section ${n} of ${SECTIONS.length} · about 3 minutes</div>
    <h2>${esc(spec.title)}</h2>
    <p class="lede">${esc(spec.brief)}</p>

    <section class="part">
      ${head(1, 'First thoughts')}
      <label class="part-hint" for="first">Quick notes or gut feel. A minute is plenty, and rough is fine. You might touch on:</label>
      <ul class="nudges">${spec.questions.map((q) => `<li>${esc(q)}</li>`).join('')}</ul>
      <textarea id="first" data-first class="notes">${esc(sec.first)}</textarea>
      ${live.error ? `<div class="error" role="alert">${esc(live.error)}</div>` : ''}
      <div class="row">
        ${busy ? '' : `<button class="btn${open ? ' dark small' : ''}" data-act="look">${sec.looked ? 'Changed your notes? Look again' : 'See things to consider'}</button>`}
        ${open || busy ? '' : `<button class="btn quiet" data-act="skip-toolkit">Write my plan without the toolkit</button>`}
      </div>
    </section>

    <section class="part${sec.looked || busy ? '' : ' later'}" id="toolkit-part">
      ${head(2, 'Things to consider')}
      ${consider}
    </section>

    <section class="part${open ? '' : ' later'}" id="plan-part">
      ${head(3, 'Your plan, in your words')}
      ${open ? `<label class="part-hint" for="plan">${sec.planTouched ? 'This goes into your plan exactly as written.' : 'Your first thoughts are copied here. Change them however you like now that you have read the toolkit. This goes into your plan exactly as written.'}</label>
      <textarea id="plan" data-plan class="notes">${esc(sec.plan)}</textarea>
      <label class="part-hint sub" for="notes"><strong>Still to figure out.</strong> Your own list, one per line. Nothing lands here unless you put it here.</label>
      <textarea id="notes" data-notes placeholder="For example: do we need a permit for the container?">${esc(sec.notes)}</textarea>
      ${suggestions}
      <div class="row">
        <button class="btn" data-act="accept">Looks good, next</button>
      </div>` : `<p class="part-hint">After reading, you write this part of your plan and list what is still open. Your first thoughts come with you.</p>`}
    </section>

    ${open ? '' : `<div class="row"><button class="btn quiet" data-go="${nextAfter(spec.id)}">Skip this section for now</button></div>`}
    ${footer()}
  </div>`;
}

function viewPlan() {
  const p = state.project;
  const begun = SECTIONS.filter((s) => started(state.sections[s.id]));
  const missing = SECTIONS.filter((s) => !started(state.sections[s.id]));
  const open = [];
  const body = begun.map((s) => {
    const sec = state.sections[s.id];
    for (const l of lines(sec.notes)) open.push({ text: l, from: s.title });
    return `<section class="plan-section">
      <h2>${esc(s.title)}</h2>
      ${answered(sec) ? `<h3 class="plan-sub">Our plan</h3><p class="verbatim">${esc(words(sec))}</p>` : ''}
      ${kept(sec).length ? `<h3 class="plan-sub">From the toolkit</h3>${kept(sec).map((k) => `<div class="passage"><blockquote>${esc(k.quote)}</blockquote><div class="source">${sourceLine(k)}</div></div>`).join('')}` : ''}
      ${lines(sec.notes).length ? `<h3 class="plan-sub">Still to figure out</h3><ul class="verbatim-list">${lines(sec.notes).map((l) => `<li>${esc(l)}</li>`).join('')}</ul>` : ''}
    </section>`;
  }).join('');
  const facts = PROJECT_FIELDS.filter((f) => String(p[f.key] || '').trim())
    .map((f) => `<dt>${esc(f.label)}</dt><dd class="verbatim">${esc(p[f.key])}</dd>`).join('');
  return `<div class="col">
    <div class="pill">Your plan</div>
    <h1>Library of Things Launch Plan</h1>
    ${facts ? `<dl class="facts">${facts}</dl>` : ''}
    ${begun.length ? `<p class="provenance">Your plan and open questions are exactly as you wrote them. Toolkit passages are quoted word for word, with links. No part of this plan was written by AI.</p>
    <div class="row no-print">
      <button class="btn" data-act="print">Print or save as PDF</button>
      <button class="btn dark" data-act="word">Download as Word</button>
      <button class="btn dark" data-act="copy">Copy for Google Docs or Word</button>
    </div>` : `<p class="lede">Nothing here yet. Start with the first section and your plan will collect here.</p>
      <div class="row"><button class="btn" data-go="${SECTIONS[0].id}">Go to the first section</button></div>`}
    ${body}
    ${open.length ? `<section class="plan-section open-qs"><h2>Everything still to figure out</h2>
      <div class="prose"><p>Your own list, gathered from every section. Bring it to your team, your residents, or your next 1:1 with Shareable.</p></div>
      <ul class="verbatim-list">${open.map((o) => `<li>${esc(o.text)} <span style="color:var(--soft)">(${esc(o.from)})</span></li>`).join('')}</ul></section>` : ''}
    ${begun.length && missing.length ? `<p class="lede no-print">Not started yet: ${missing.map((s) => `<a href="#" data-go="${s.id}">${esc(s.title)}</a>`).join(', ')}.</p>` : ''}
    ${footer()}
  </div>`;
}

function renderSide() {
  const dot = (cls, mark) => `<span class="dot ${cls}" aria-hidden="true">${mark}</span>`;
  const item = (view, label, cls = '', mark = '') => `<li><button data-go="${view}" ${state.view === view ? 'aria-current="step"' : ''}>${dot(cls, mark)}<span>${esc(label)}</span></button></li>`;
  const hasProject = Object.values(state.project).some((v) => String(v || '').trim());
  const begun = SECTIONS.filter((x) => started(state.sections[x.id])).length;
  document.getElementById('top').innerHTML = `
    <div class="exp"><span class="full">Experiment by the Relational Tech Project · Not Shareable's official toolkit</span><span class="short">Experiment · Not the official toolkit</span></div>
    <div class="top-in">
      <button class="brand" data-go="welcome" title="Library of Things Launch Plan"><small>Shareable toolkit, guided</small><span class="full">Library of Things Launch Plan</span><span class="short">LoT Launch Plan</span></button>
      <div class="top-actions">
        <button class="btn small" data-act="ask-open">Ask</button>
        <button class="btn small" data-act="nav" aria-expanded="${live.navOpen}" aria-controls="side">${live.navOpen ? 'Close' : 'Sections'}</button>
      </div>
    </div>
    <div class="progress" role="progressbar" aria-label="Sections started" aria-valuemin="0" aria-valuemax="${SECTIONS.length}" aria-valuenow="${begun}"><i style="width:${(begun / SECTIONS.length) * 100}%"></i></div>`;
  document.getElementById('side').className = 'side' + (live.navOpen ? ' open' : '');
  document.body.style.overflow = live.navOpen && matchMedia('(max-width: 900px)').matches ? 'hidden' : '';
  document.getElementById('side').innerHTML = `
    <div class="side-label">Your plan · ${begun} of ${SECTIONS.length} started</div>
    <ol class="steps">
      ${item('welcome', 'Welcome', 'plain')}
      ${item('project', 'About your project', hasProject ? 'done' : '', hasProject ? '✓' : '')}
      <li class="gap"></li>
      ${SECTIONS.map((s) => { const sec = state.sections[s.id]; return item(s.id, s.title, sec.done ? 'done' : started(sec) ? 'drafted' : '', sec.done ? '✓' : ''); }).join('')}
      <li class="gap"></li>
      ${item('plan', 'Your launch plan', 'plain')}
    </ol>
    <div class="side-foot"><button class="btn quiet small" data-act="reset">Start over</button></div>`;
}

function renderAsk() {
  const a = live.ask;
  const el = document.getElementById('ask');
  if (!a.open) {
    el.innerHTML = `<button class="btn dark ask-fab no-print" data-act="ask-open">Ask the toolkit</button>`;
    return;
  }
  let result = '';
  if (a.busy) result = `<div class="writing" style="margin-top:16px"><span class="pulse"></span>Looking through the toolkit</div>`;
  else if (a.passages && !a.passages.length) result = `<p class="part-hint" style="margin-top:16px">The toolkit passages found do not answer this. Try other words, or take it to your 1:1 with Shareable.</p>`;
  else if (a.passages) result = `<div style="margin-top:14px">${a.passages.map((p, i) => passageHtml(p, i, false)).join('')}</div>`;
  el.innerHTML = `<div class="scrim no-print" data-act="ask-close"></div><div class="ask-panel no-print" role="dialog" aria-label="Ask the toolkit">
    <div class="card-head"><h3>Ask the toolkit</h3><button class="btn quiet small" data-act="ask-close">Close</button></div>
    <p class="hint">You get passages quoted word for word from Shareable's toolkit, not a written answer.</p>
    <textarea id="ask-q" placeholder="For example: how do other libraries handle items that come back broken?">${esc(a.q)}</textarea>
    <div class="row" style="margin-top:10px"><button class="btn small" data-act="ask-go" ${a.busy ? 'disabled' : ''}>${a.busy ? 'Looking' : 'Ask'}</button></div>
    ${a.error ? `<div class="error" role="alert">${esc(a.error)}</div>` : ''}
    ${result}
  </div>`;
}

function render() {
  const spec = sectionById(state.view);
  const html = state.view === 'welcome' ? viewWelcome()
    : state.view === 'project' ? viewProject()
    : state.view === 'plan' ? viewPlan()
    : spec ? viewSection(spec) : viewWelcome();
  document.getElementById('main').innerHTML = html;
  renderSide();
  renderAsk();
}

// ---------- Events ----------

document.addEventListener('input', (e) => {
  const t = e.target;
  const sec = state.sections[state.view];
  if (t.dataset.project) { state.project[t.dataset.project] = t.value; save(); }
  else if (t.dataset.first !== undefined) { sec.first = t.value; save(); }
  else if (t.dataset.plan !== undefined) { sec.plan = t.value; sec.planTouched = true; save(); }
  else if (t.dataset.notes !== undefined) { sec.notes = t.value; save(); }
  else if (t.id === 'ask-q') live.ask.q = t.value;
});

document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.keep === undefined) return;
  const sec = state.sections[state.view];
  sec.passages[Number(t.dataset.keep)].keep = t.checked;
  t.closest('.passage').classList.toggle('off', !t.checked);
  save();
});

document.addEventListener('click', async (e) => {
  const goEl = e.target.closest('[data-go]');
  if (goEl) { e.preventDefault(); go(goEl.dataset.go); return; }
  const sug = e.target.closest('[data-suggest]');
  if (sug) {
    // The person chooses to add it; from here on it is their line to edit
    const sec = state.sections[state.view];
    const q = sec.suggestions[Number(sug.dataset.suggest)];
    const box = document.getElementById('notes');
    sec.notes = (box.value.trim() ? box.value.replace(/\s+$/, '') + '\n' : '') + q.q;
    q.added = true;
    save();
    box.value = sec.notes;
    sug.disabled = true; sug.classList.add('added'); sug.textContent = `✓ ${q.q}`;
    return;
  }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const id = state.view;
  const sec = state.sections[id];
  switch (el.dataset.act) {
    case 'look': look(id); break;
    case 'skip-toolkit': sec.skipped = true; if (!sec.planTouched) sec.plan = sec.first; save(); render(); document.getElementById('plan-part').scrollIntoView({ block: 'start' }); break;
    case 'accept': sec.done = true; go(nextAfter(id)); break;
    case 'nav': live.navOpen = !live.navOpen; renderSide(); break;
    case 'reset':
      if (confirm('Start over? This clears everything you wrote from this browser.')) { state = blank(); live.ask = { open: false, q: '', passages: null, busy: false, error: null }; save(); go('welcome'); }
      break;
    case 'print': window.print(); break;
    case 'copy': {
      // Rich text for a paste that keeps headings, quotes and links; plain text rides along for anything else
      const label = el.textContent;
      try {
        await navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([planHtml()], { type: 'text/html' }),
          'text/plain': new Blob([planMarkdown()], { type: 'text/plain' }),
        })]);
        el.textContent = 'Copied. Now paste into your doc';
      } catch {
        try { await navigator.clipboard.writeText(planMarkdown()); el.textContent = 'Copied as plain text'; }
        catch { el.textContent = 'Copy did not work. Try Download as Word'; }
      }
      setTimeout(() => { el.textContent = label; }, 2600);
      break;
    }
    case 'word': {
      const url = URL.createObjectURL(planDocx());
      const a = Object.assign(document.createElement('a'), { href: url, download: 'library-of-things-launch-plan.docx' });
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      break;
    }
    case 'ask-open': live.ask.open = true; live.navOpen = false; renderSide(); renderAsk(); document.getElementById('ask-q').focus(); break;
    case 'ask-close': live.ask.open = false; renderAsk(); break;
    case 'ask-go': ask(); break;
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && live.ask.open) { live.ask.open = false; renderAsk(); }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.id === 'ask-q') ask();
});

// ---------- Start ----------

(async () => {
  try {
    const res = await fetch('sections.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error(String(res.status));
    const config = await res.json();
    PROJECT_FIELDS = config.project;
    SECTIONS = config.sections;
  } catch {
    document.getElementById('main').innerHTML = '<div class="col"><div class="error" role="alert">The workbook could not load its questions. Check your connection and reload the page.</div></div>';
    return;
  }
  load();
  render();
})();
</script>
</body>
</html>
