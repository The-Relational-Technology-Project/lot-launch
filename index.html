<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Library of Things Launch Plan</title>
<meta name="description" content="A guided workbook for writing the launch plan for a library of things in your building, grounded in Shareable's Library of Things Toolkit 2.0.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#232D58">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Source+Serif+4:opsz,wght@8..60,400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top no-print" id="top"></header>
<div class="shell">
  <nav class="side" id="side" aria-label="Sections"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<div id="ask"></div>

<script>
// The server half lives in supabase/functions/lot-plan. It owns the toolkit
// search and the prompts; this page only sends answers.
const API = 'https://texakzqqenzpxawktbgx.supabase.co/functions/v1/lot-plan';
const TOOLKIT = 'https://www.shareable.net/toolkit/library-of-things/';
// Served from Shareable's own site, resized by their image CDN
const COVER = 'https://i0.wp.com/www.shareable.net/wp-content/uploads/2026/03/LoT-2-Digital-Toolkit-Cover-2-scaled.png?w=1200&quality=80&ssl=1';
const STORE = 'lot-launch-plan-v1';

const PROJECT_FIELDS = [
  { key: 'org', label: 'Your organization', short: true },
  { key: 'city', label: 'City', short: true },
  { key: 'building', label: 'The building', hint: 'What kind of housing, how many homes, and who lives there.' },
  { key: 'space', label: 'The space you have in mind', hint: 'A storage room, a community room corner, a closet off the lobby. Rough size if you know it.' },
  { key: 'team', label: 'Who is working on this', hint: 'Staff, resident leaders, partners. Names or roles.' },
  { key: 'budget', label: 'Rough budget', hint: 'What you have or expect for opening and the first year. A range is fine.', short: true },
  { key: 'opening', label: 'When you want to open', short: true },
  { key: 'heard', label: 'What residents have told you so far', hint: 'Anything they have asked for or worried about. Leave blank if you have not asked yet.' },
];

const SECTIONS = [
  { id: 'purpose', title: 'Purpose and people', brief: 'Why this library of things, who it is for, and who will carry it.', questions: [
    'Why does this building need a library of things? What would be different for residents a year from now?',
    'Who is it for? Residents only, or neighbors too?',
    'Who will carry it day to day, and who else needs to be in the circle so it does not rest on one person?' ] },
  { id: 'residents', title: 'Resident needs and engagement', brief: 'How residents shape what the library holds and how it runs.', questions: [
    'How have you asked residents what they would borrow, or how will you?',
    'Who is hard to reach in the building (language, schedule, trust), and what would help?',
    'How will residents keep having a say once it is open?' ] },
  { id: 'space', title: 'Space and setup', brief: 'Where it lives in the building, how it is laid out, and how people get to it.', questions: [
    'Describe the space: where it is, how big, who holds the key today.',
    'When could it be open, and who would be there?',
    'What needs to change before opening (shelving, power, locks, signs, access for people with mobility needs)?' ] },
  { id: 'items', title: 'Items: what to stock and how to get them', brief: 'The opening inventory, where items come from, and how they stay in working order.', questions: [
    'What are the first 15 to 30 items you expect residents to want?',
    'Where will items come from: purchase, donations, partners?',
    'Who checks, cleans and repairs items when they come back?' ] },
  { id: 'policies', title: 'Policies and lending system', brief: 'How borrowing works, and what tracks it.', questions: [
    'Who can borrow, for how long, and does it cost anything?',
    'What should happen when something comes back late, broken, or not at all?',
    'How will you track loans: lending software, a spreadsheet, a paper ledger? Any constraint from your property management systems?' ] },
  { id: 'people', title: 'Staffing, volunteers and resident roles', brief: 'Who opens the door, who looks after items, and how residents take on roles.', questions: [
    'How many staff hours per week can you commit, and whose?',
    'What roles could residents or volunteers hold, and is there a stipend or other thank you?',
    'How will people be trained and supported?' ] },
  { id: 'budget', title: 'Budget and funding', brief: 'What it costs to open and to run for a year, and where the money comes from.', questions: [
    'What do you expect to spend before opening, and on what?',
    'What will it cost to run each year, and which line in your budget does that sit on?',
    'Which funding sources are realistic: operating budget, resident services funds, grants, sponsors, fees?' ] },
  { id: 'risk', title: 'Insurance, risk and governance', brief: 'How risk is handled, what cover is needed, and who decides.', questions: [
    'What have your insurer, risk manager or lawyer said so far, if anything?',
    'Which items or situations worry you most?',
    'Who makes decisions about the library, and how are residents part of that?' ] },
  { id: 'partners', title: 'Partners', brief: 'Who to work with nearby, and what each side brings.', questions: [
    'Who do you already work with that could help (tool libraries, the public library, nonprofits, city agencies, local businesses)?',
    'What do you most need from a partner: items, expertise, volunteers, money, repair skills?',
    'What can you offer in return?' ] },
  { id: 'launch', title: 'Outreach and launch event', brief: 'How residents hear about it, and what opening day looks like.', questions: [
    'How do residents hear about things in the building today, and what works?',
    'What would a good opening day look like?',
    'Does it have a name yet? Any workshops or repair events you want to run in the first months?' ] },
  { id: 'timeline', title: 'Timeline to opening day', brief: 'The steps between now and opening, in order, with who does each.', questions: [
    'What is already done, and what must happen before anything else can?',
    'What fixed dates or approvals are you working around?',
    'Who owns the timeline?' ] },
];

// ---------- State ----------

function blank() {
  const sections = {};
  for (const s of SECTIONS) sections[s.id] = { answers: s.questions.map(() => ''), draft: '', done: false };
  return { view: 'welcome', project: {}, sections, sources: {} };
}

let state = blank();
try {
  const saved = JSON.parse(localStorage.getItem(STORE) || 'null');
  if (saved && saved.sections) {
    state = { ...blank(), ...saved };
    for (const s of SECTIONS) state.sections[s.id] = { ...blank().sections[s.id], ...(saved.sections[s.id] || {}) };
  }
} catch { /* a fresh start is fine */ }

function save() {
  try { localStorage.setItem(STORE, JSON.stringify(state)); } catch { /* private mode: keep working in memory */ }
}

// Not saved: what is happening right now
const live = { busy: null, error: null, editing: null, redraft: null, navOpen: false, ask: { open: false, q: '', a: '', busy: false, error: null } };

// ---------- Small helpers ----------

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sectionById = (id) => SECTIONS.find((s) => s.id === id);
const STILL = /^#{2,4}\s*still to figure out\s*$/im;

function splitDraft(md) {
  const m = STILL.exec(md);
  if (!m) return { body: md.trim(), open: [] };
  const open = md.slice(m.index + m[0].length).split('\n').map((l) => l.replace(/^\s*[-*]\s+/, '').trim()).filter(Boolean);
  return { body: md.slice(0, m.index).trim(), open };
}

/** Markdown to HTML for the small subset the drafts use. Returns the cited ids in order. */
function renderMd(md) {
  const cited = [];
  const inline = (text) => esc(text)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*?)\*/g, '$1<em>$2</em>')
    .replace(/\[((?:lot-\d+)(?:\s*,\s*lot-\d+)*)\]/g, (_, ids) => ids.split(/\s*,\s*/).map((id) => {
      const src = state.sources[id];
      if (!src) return '';
      if (!cited.includes(id)) cited.push(id);
      return `<a class="cite" href="${esc(src.url)}" target="_blank" rel="noopener" title="${esc(src.heading)}">${cited.indexOf(id) + 1}</a>`;
    }).join(''));
  const out = [];
  let list = null;
  let para = [];
  const flush = () => {
    if (para.length) { out.push(`<p>${inline(para.join(' '))}</p>`); para = []; }
    if (list) { out.push(`</${list}>`); list = null; }
  };
  for (const raw of md.split('\n')) {
    const line = raw.trimEnd();
    let m;
    if (!line.trim()) { flush(); }
    else if ((m = /^#{1,4}\s+(.*)$/.exec(line))) { flush(); out.push(`<h3>${inline(m[1])}</h3>`); }
    else if ((m = /^\s*[-*]\s+(.*)$/.exec(line))) {
      if (list !== 'ul') { flush(); out.push('<ul>'); list = 'ul'; }
      out.push(`<li>${inline(m[1])}</li>`);
    } else if ((m = /^\s*\d+[.)]\s+(.*)$/.exec(line))) {
      if (list !== 'ol') { flush(); out.push('<ol>'); list = 'ol'; }
      out.push(`<li>${inline(m[1])}</li>`);
    } else {
      if (list) flush();
      para.push(line.trim());
    }
  }
  flush();
  return { html: out.join('\n'), cited };
}

function sourcesHtml(cited) {
  if (!cited.length) return '';
  const items = cited.map((id) => {
    const s = state.sources[id];
    const where = [s.section, s.chapter && s.chapter !== s.heading ? s.chapter : ''].filter(Boolean).join(', ');
    return `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.heading)}</a> <span>${esc(where)}</span></li>`;
  }).join('');
  return `<div class="sources"><div class="tag">From the toolkit</div><ol>${items}</ol></div>`;
}

/** Calls the server and feeds text to onText as it arrives. */
async function stream(body, onText) {
  let res;
  try {
    res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  } catch {
    throw new Error('Could not reach the server. Check your connection and try again. Your answers are saved.');
  }
  if (!res.ok || !res.body) {
    const data = await res.json().catch(() => ({}));
    throw new Error(data.error || 'Something went wrong. Try again.');
  }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let text = '';
  let finished = false;
  const handle = (line) => {
    if (!line.trim()) return;
    const event = JSON.parse(line);
    if (event.type === 'sources') {
      for (const s of event.sources) state.sources[s.id] = s;
    } else if (event.type === 'delta') {
      text += event.text;
      onText(text);
    } else if (event.type === 'error') {
      throw new Error(event.error);
    } else if (event.type === 'done') {
      finished = true;
    }
  };
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    let nl;
    while ((nl = buffer.indexOf('\n')) >= 0) {
      handle(buffer.slice(0, nl));
      buffer = buffer.slice(nl + 1);
    }
  }
  handle(buffer);
  if (!finished || !text.trim()) throw new Error('The draft stopped part way. Try again.');
  return text;
}

// ---------- Actions ----------

function go(view) {
  state.view = view;
  live.error = null; live.editing = null; live.redraft = null; live.navOpen = false;
  save();
  render();
  window.scrollTo(0, 0);
  document.getElementById('main').focus({ preventScroll: true });
}

function nextAfter(id) {
  const i = SECTIONS.findIndex((s) => s.id === id);
  return i + 1 < SECTIONS.length ? SECTIONS[i + 1].id : 'plan';
}

async function draft(id, note) {
  if (live.busy) return;
  const spec = sectionById(id);
  const sec = state.sections[id];
  const done = SECTIONS.filter((s) => s.id !== id && state.sections[s.id].draft)
    .map((s) => ({ title: s.title, text: splitDraft(state.sections[s.id].draft).body.replace(/\[lot-\d+\]/g, '').slice(0, 320) }));
  const previous = sec.draft;
  live.busy = id; live.error = null; live.editing = null; live.redraft = null;
  sec.draft = '';
  render();
  document.getElementById('draft-card')?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  try {
    const text = await stream({
      action: 'draft', section: id, project: state.project,
      answers: spec.questions.map((q, i) => ({ q, a: sec.answers[i] })),
      done, current: note ? previous : undefined, note: note || undefined,
    }, (t) => {
      sec.draft = t;
      const el = document.getElementById('draft-body');
      if (el) el.innerHTML = renderMd(t).html;
    });
    sec.draft = text.trim();
    sec.done = false;
  } catch (err) {
    sec.draft = previous;
    live.error = err.message;
  }
  live.busy = null;
  save();
  render();
}

async function ask() {
  const a = live.ask;
  if (a.busy || a.q.trim().length < 3) return;
  a.busy = true; a.error = null; a.a = '';
  renderAsk();
  try {
    a.a = await stream({ action: 'ask', question: a.q, project: state.project }, (t) => {
      a.a = t;
      const el = document.getElementById('ask-answer');
      if (el) el.innerHTML = renderMd(t).html;
    });
  } catch (err) {
    a.error = err.message;
  }
  a.busy = false;
  save();
  renderAsk();
}

function planMarkdown() {
  const p = state.project;
  const lines = [`# Library of Things Launch Plan`, ''];
  if (p.org || p.city) lines.push(`**${[p.org, p.city].filter(Boolean).join(', ')}**`, '');
  for (const f of PROJECT_FIELDS) if (p[f.key] && f.key !== 'org' && f.key !== 'city') lines.push(`- ${f.label}: ${p[f.key]}`);
  lines.push('');
  const cited = [];
  const open = [];
  for (const s of SECTIONS) {
    const sec = state.sections[s.id];
    if (!sec.draft) continue;
    const parts = splitDraft(sec.draft);
    lines.push(`## ${s.title}`, '', parts.body, '');
    for (const o of parts.open) open.push(`${o.replace(/\s*\[lot-[\d,\slot-]*\]/g, '')} (${s.title})`);
    for (const m of sec.draft.matchAll(/lot-\d+/g)) if (state.sources[m[0]] && !cited.includes(m[0])) cited.push(m[0]);
  }
  if (open.length) lines.push('## Still to figure out', '', ...open.map((o) => `- ${o}`), '');
  if (cited.length) {
    lines.push('## From the toolkit', '');
    for (const id of cited) lines.push(`- [${id}] ${state.sources[id].heading}: ${state.sources[id].url}`);
    lines.push('');
  }
  lines.push(`Drafted with the Library of Things Launch Plan prototype, built on the Library of Things Toolkit 2.0 by Shareable (CC BY-NC-ND 4.0): ${TOOLKIT}`);
  return lines.join('\n');
}

// ---------- Views ----------

function footer() {
  return `<footer>
    Built on the <a href="${TOOLKIT}" target="_blank" rel="noopener">Library of Things Toolkit 2.0</a> by Shareable (CC BY-NC-ND 4.0).
    A prototype by the Relational Tech Project. Drafts are a starting point: check anything about insurance, legal or money with your own advisors.
    <span class="no-print">Your answers stay in this browser. They are sent to an AI model only to write each draft.</span>
    <span class="no-print">Rather talk it through? <a href="chat">Try the conversation version</a>.</span>
  </footer>`;
}

function viewWelcome() {
  const started = Object.keys(state.project).length || SECTIONS.some((s) => state.sections[s.id].draft);
  return `<div class="col">
    <div class="hero">
      <div class="hero-text">
        <div class="pill">For Co-Lab teams</div>
        <h1>Write your launch plan, one section at a time</h1>
        <p class="lede">You bring what you know about your building and your residents. This workbook drafts each part of your plan from Shareable's Library of Things Toolkit, and shows you where every idea came from.</p>
        <div class="row">
          <button class="btn" data-go="project">${started ? 'Pick up where you left off' : 'Start with your project'}</button>
        </div>
      </div>
      <a class="hero-art" href="${TOOLKIT}" target="_blank" rel="noopener" aria-label="The Library of Things Toolkit, second edition, by Shareable">
        <img src="${COVER}" alt="Cover of The Library of Things Toolkit, second edition, by Shareable" width="1200" height="799" onerror="this.parentNode.remove()">
      </a>
    </div>
    <div class="card how">
      <div class="prose">
        <h3>How it works</h3>
        <ol>
          <li>Tell it about your project. Two minutes.</li>
          <li>Work through ${SECTIONS.length} sections. Answer what you can, skip what you cannot. Edit every draft.</li>
          <li>Leave with a plan you can print, and a list of what is still to figure out for your next 1:1.</li>
        </ol>
        <p>Plan on 30 to 45 minutes. You can stop and come back: your work is saved in this browser.</p>
      </div>
    </div>
    ${started ? '<div class="row"><button class="btn quiet" data-act="reset">Start over</button></div>' : ''}
    ${footer()}
  </div>`;
}

function viewProject() {
  const field = (f) => `<div class="field">
      <label for="p-${f.key}">${f.label}${f.hint ? `<span class="hint">${f.hint}</span>` : ''}</label>
      ${f.short
        ? `<input type="text" id="p-${f.key}" data-project="${f.key}" value="${esc(state.project[f.key])}">`
        : `<textarea id="p-${f.key}" data-project="${f.key}">${esc(state.project[f.key])}</textarea>`}
    </div>`;
  const short = PROJECT_FIELDS.filter((f) => f.short);
  const long = PROJECT_FIELDS.filter((f) => !f.short);
  return `<div class="col">
    <div class="pill">Step 1</div>
    <h2>About your project</h2>
    <p class="lede">Every draft is written for this building. Rough answers are fine, and you can change them later.</p>
    <div class="two">${short.map(field).join('')}</div>
    ${long.map(field).join('')}
    <div class="row">
      <button class="btn" data-go="${SECTIONS[0].id}">Start the plan</button>
    </div>
    ${footer()}
  </div>`;
}

function viewSection(spec) {
  const sec = state.sections[spec.id];
  const n = SECTIONS.indexOf(spec) + 1;
  const busy = live.busy === spec.id;
  const questions = spec.questions.map((q, i) => `<div class="field">
      <label for="q-${i}">${esc(q)}</label>
      <textarea id="q-${i}" data-answer="${i}">${esc(sec.answers[i])}</textarea>
    </div>`).join('');

  let draftCard = '';
  if (busy || sec.draft) {
    const parts = renderMd(sec.draft);
    const editing = live.editing === spec.id;
    draftCard = `<div class="card" id="draft-card">
      <div class="card-head">
        <span class="banner">Your draft</span>
        ${busy ? '<span class="writing"><span class="pulse"></span>Reading the toolkit and writing</span>' : ''}
      </div>
      ${editing
        ? `<textarea class="edit-area" id="edit-area" aria-label="Edit your draft">${esc(sec.draft)}</textarea>
           <div class="row"><button class="btn small" data-act="save-edit">Save changes</button><button class="btn quiet small" data-act="cancel-edit">Cancel</button></div>`
        : `<div class="prose" id="draft-body">${parts.html}</div>${busy ? '' : sourcesHtml(parts.cited)}`}
      ${!busy && !editing ? (live.redraft === spec.id
        ? `<div class="field"><label for="note">What should change?</label><textarea id="note" placeholder="For example: shorter, or we decided on no late fees."></textarea></div>
           <div class="row"><button class="btn small" data-act="redraft-go">Redraft</button><button class="btn quiet small" data-act="redraft-cancel">Cancel</button></div>`
        : `<div class="row no-print">
             <button class="btn" data-act="accept">Looks good, next</button>
             <button class="btn ghost" data-act="edit">Edit</button>
             <button class="btn quiet" data-act="redraft">Redraft</button>
           </div>`) : ''}
    </div>`;
  }

  return `<div class="col">
    <div class="pill">Section ${n} of ${SECTIONS.length}</div>
    <h2>${esc(spec.title)}</h2>
    <p class="lede">${esc(spec.brief)}</p>
    ${questions}
    ${live.error ? `<div class="error" role="alert">${esc(live.error)}</div>` : ''}
    <div class="row">
      ${sec.draft || busy ? '' : `<button class="btn" data-act="draft">Draft this section</button>
      <button class="btn quiet" data-go="${nextAfter(spec.id)}">Skip for now</button>`}
    </div>
    ${draftCard}
    ${footer()}
  </div>`;
}

function viewPlan() {
  const p = state.project;
  const drafted = SECTIONS.filter((s) => state.sections[s.id].draft);
  const open = [];
  const body = SECTIONS.map((s) => {
    const sec = state.sections[s.id];
    if (!sec.draft) return `<section class="plan-section no-print"><h2>${esc(s.title)}</h2><p class="empty">Not drafted yet. <a href="#" data-go="${s.id}">Work on this section</a></p></section>`;
    const parts = splitDraft(sec.draft);
    for (const o of parts.open) open.push({ text: o.replace(/\s*\[lot-[\d,\slot-]*\]/g, ''), from: s.title });
    const r = renderMd(parts.body);
    return `<section class="plan-section"><h2>${esc(s.title)}</h2><div class="prose">${r.html}</div>${sourcesHtml(r.cited)}</section>`;
  }).join('');
  const facts = PROJECT_FIELDS.filter((f) => p[f.key] && f.key !== 'org' && f.key !== 'city')
    .map((f) => `<dt>${f.label}</dt><dd>${esc(p[f.key])}</dd>`).join('');
  return `<div class="col">
    <div class="pill">${esc([p.org, p.city].filter(Boolean).join(', ') || 'Your plan')}</div>
    <h1>Library of Things Launch Plan</h1>
    ${facts ? `<dl class="facts">${facts}</dl>` : ''}
    ${drafted.length && drafted.length < SECTIONS.length ? `<p class="lede no-print">${drafted.length} of ${SECTIONS.length} sections drafted so far.</p>` : ''}
    ${drafted.length ? `<div class="row no-print">
      <button class="btn" data-act="print">Print or save as PDF</button>
      <button class="btn dark" data-act="copy">Copy as text</button>
      <button class="btn dark" data-act="download">Download</button>
    </div>` : `<p class="lede">Nothing drafted yet. Start with the first section and your plan will collect here.</p>
      <div class="row"><button class="btn" data-go="${SECTIONS[0].id}">Go to the first section</button></div>`}
    ${body}
    ${open.length ? `<section class="plan-section open-qs"><h2>Still to figure out</h2>
      <div class="prose"><p>Bring these to your team, your residents, or your next 1:1 with Shareable.</p>
      <ul>${open.map((o) => `<li>${renderMd(o.text).html.replace(/^<p>|<\/p>$/g, '')} <span style="color:var(--soft)">(${esc(o.from)})</span></li>`).join('')}</ul></div></section>` : ''}
    ${footer()}
  </div>`;
}

function renderSide() {
  const dot = (cls, mark) => `<span class="dot ${cls}" aria-hidden="true">${mark}</span>`;
  const item = (view, label, cls = '', mark = '') => `<li><button data-go="${view}" ${state.view === view ? 'aria-current="step"' : ''}>${dot(cls, mark)}<span>${esc(label)}</span></button></li>`;
  const hasProject = Object.values(state.project).some((v) => String(v || '').trim());
  const drafted = SECTIONS.filter((x) => state.sections[x.id].draft).length;
  document.getElementById('top').innerHTML = `
    <div class="top-in">
      <button class="brand" data-go="welcome" title="Library of Things Launch Plan"><small>Shareable toolkit, guided</small><span class="full">Library of Things Launch Plan</span><span class="short">LoT Launch Plan</span></button>
      <div class="top-actions">
        <button class="btn small" data-act="ask-open">Ask</button>
        <button class="btn small" data-act="nav" aria-expanded="${live.navOpen}" aria-controls="side">${live.navOpen ? 'Close' : 'Sections'}</button>
      </div>
    </div>
    <div class="progress" role="progressbar" aria-label="Sections drafted" aria-valuemin="0" aria-valuemax="${SECTIONS.length}" aria-valuenow="${drafted}"><i style="width:${(drafted / SECTIONS.length) * 100}%"></i></div>`;
  document.getElementById('side').className = 'side' + (live.navOpen ? ' open' : '');
  document.body.style.overflow = live.navOpen && matchMedia('(max-width: 900px)').matches ? 'hidden' : '';
  document.getElementById('side').innerHTML = `
    <div class="side-label">Your plan · ${drafted} of ${SECTIONS.length} drafted</div>
    <ol class="steps">
      ${item('welcome', 'Welcome', 'plain')}
      ${item('project', 'About your project', hasProject ? 'done' : '', hasProject ? '✓' : '')}
      <li class="gap"></li>
      ${SECTIONS.map((s) => { const sec = state.sections[s.id]; return item(s.id, s.title, sec.done ? 'done' : sec.draft ? 'drafted' : '', sec.done ? '✓' : ''); }).join('')}
      <li class="gap"></li>
      ${item('plan', 'Your launch plan', 'plain')}
    </ol>
    <div class="side-foot"><button class="btn quiet small" data-act="reset">Start over</button></div>`;
}

function renderAsk() {
  const a = live.ask;
  const el = document.getElementById('ask');
  if (!a.open) {
    el.innerHTML = `<button class="btn dark ask-fab no-print" data-act="ask-open">Ask the toolkit</button>`;
    return;
  }
  const r = renderMd(a.a);
  el.innerHTML = `<div class="scrim no-print" data-act="ask-close"></div><div class="ask-panel no-print" role="dialog" aria-label="Ask the toolkit">
    <div class="card-head"><h3>Ask the toolkit</h3><button class="btn quiet small" data-act="ask-close">Close</button></div>
    <p class="hint">A one-off question, answered only from Shareable's toolkit.</p>
    <textarea id="ask-q" placeholder="For example: how do other libraries handle items that come back broken?">${esc(a.q)}</textarea>
    <div class="row" style="margin-top:10px"><button class="btn small" data-act="ask-go" ${a.busy ? 'disabled' : ''}>${a.busy ? 'Looking' : 'Ask'}</button></div>
    ${a.error ? `<div class="error" role="alert">${esc(a.error)}</div>` : ''}
    ${a.a || a.busy ? `<div class="prose" id="ask-answer" style="margin-top:16px">${r.html}</div>${a.busy ? '' : sourcesHtml(r.cited)}` : ''}
  </div>`;
}

function render() {
  const spec = sectionById(state.view);
  const html = state.view === 'welcome' ? viewWelcome()
    : state.view === 'project' ? viewProject()
    : state.view === 'plan' ? viewPlan()
    : spec ? viewSection(spec) : viewWelcome();
  document.getElementById('main').innerHTML = html;
  renderSide();
  renderAsk();
}

// ---------- Events ----------

document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.project) { state.project[t.dataset.project] = t.value; save(); }
  else if (t.dataset.answer !== undefined) { state.sections[state.view].answers[Number(t.dataset.answer)] = t.value; save(); }
  else if (t.id === 'ask-q') live.ask.q = t.value;
});

document.addEventListener('click', async (e) => {
  const goEl = e.target.closest('[data-go]');
  if (goEl) { e.preventDefault(); go(goEl.dataset.go); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const id = state.view;
  const sec = state.sections[id];
  switch (el.dataset.act) {
    case 'draft': draft(id); break;
    case 'accept': sec.done = true; go(nextAfter(id)); break;
    case 'edit': live.editing = id; render(); document.getElementById('edit-area').focus(); break;
    case 'cancel-edit': live.editing = null; render(); break;
    case 'save-edit': sec.draft = document.getElementById('edit-area').value.trim(); live.editing = null; save(); render(); break;
    case 'redraft': live.redraft = id; render(); document.getElementById('note').focus(); break;
    case 'redraft-cancel': live.redraft = null; render(); break;
    case 'redraft-go': draft(id, document.getElementById('note').value.trim() || 'Try a different take.'); break;
    case 'nav': live.navOpen = !live.navOpen; renderSide(); break;
    case 'reset':
      if (confirm('Start over? This clears your answers and drafts from this browser.')) { state = blank(); live.ask = { open: false, q: '', a: '', busy: false, error: null }; save(); go('welcome'); }
      break;
    case 'print': window.print(); break;
    case 'copy':
      try { await navigator.clipboard.writeText(planMarkdown()); el.textContent = 'Copied'; }
      catch { el.textContent = 'Copy failed, use Download'; }
      setTimeout(() => { el.textContent = 'Copy as text'; }, 1800);
      break;
    case 'download': {
      const url = URL.createObjectURL(new Blob([planMarkdown()], { type: 'text/markdown' }));
      const a = Object.assign(document.createElement('a'), { href: url, download: 'library-of-things-launch-plan.md' });
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
      break;
    }
    case 'ask-open': live.ask.open = true; live.navOpen = false; renderSide(); renderAsk(); document.getElementById('ask-q').focus(); break;
    case 'ask-close': live.ask.open = false; renderAsk(); break;
    case 'ask-go': ask(); break;
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && live.ask.open) { live.ask.open = false; renderAsk(); }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.id === 'ask-q') ask();
});

render();
</script>
</body>
</html>
